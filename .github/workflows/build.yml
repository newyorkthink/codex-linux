name: Build Codex Desktop Linux

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this upstream commit is already published
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - variants/i3bar-fixed/**
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: codex-linux-latest
  cancel-in-progress: false

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Compare upstream with latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force == true) }}
        run: |
          set -euo pipefail

          UPSTREAM_SHA="$(git ls-remote https://github.com/ilysenko/codex-desktop-linux.git refs/heads/main | awk '{print $1}')"
          test -n "$UPSTREAM_SHA"

          PUBLISHED_BODY="$(gh release view latest --json body --jq '.body' 2>/dev/null || true)"

          if [ "$FORCE" = "true" ] || ! grep -Fq "<!-- upstream-sha: $UPSTREAM_SHA -->" <<<"$PUBLISHED_BODY"; then
            SHOULD_BUILD=true
          else
            SHOULD_BUILD=false
          fi

          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish Stock and i3bar Fixed variants
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UPSTREAM_SHA: ${{ needs.check.outputs.upstream_sha }}
      APPIMAGE_EXTRACT_AND_RUN: 1
      CODEX_STOCK_ELECTRON_CACHE_DIR: /tmp/codex-stock-electron
      NPM_CONFIG_CACHE: /tmp/codex-npm-cache
      STOCK_FEATURES_CONFIG: /tmp/codex-features-stock.json
      STOCK_PATCH_REPORT_JSON: /tmp/codex-report-stock/patch-report.json
      I3BAR_FIXED_FEATURES_CONFIG: /tmp/codex-features-i3bar-fixed.json
      I3BAR_FIXED_PATCH_REPORT_JSON: /tmp/codex-report-i3bar-fixed/patch-report.json
      STOCK_DIST_DIR: ${{ github.workspace }}/dist-stock
      I3BAR_FIXED_DIST_DIR: ${{ github.workspace }}/dist-i3bar-fixed
      RELEASE_ASSETS_DIR: ${{ github.workspace }}/release-assets
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Install appimagetool
        run: |
          sudo wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Clone exact upstream revision
        run: |
          set -euo pipefail

          git clone https://github.com/ilysenko/codex-desktop-linux.git
          cd codex-desktop-linux
          git checkout --detach "$UPSTREAM_SHA"
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Isolate AppImage Codex home from host Codex CLI
        run: |
          set -euo pipefail

          cd codex-desktop-linux

          python3 - <<'PY'
          from pathlib import Path

          path = Path("packaging/appimage/AppRun")
          source = path.read_text(encoding="utf-8")
          anchor = 'exec "$APPDIR/opt/__PACKAGE_NAME__/start.sh" "$@"\n'
          if source.count(anchor) != 1:
              raise SystemExit("expected exactly one AppImage launcher exec anchor")

          isolation = '''# ChatGPT Desktop AppImage 使用独立的 CODEX_HOME，避免与主机 Codex CLI 的 ~/.codex 共用配置、认证和本地状态
          CHATGPT_DESKTOP_CODEX_HOME="${CHATGPT_DESKTOP_CODEX_HOME:-$HOME/.codex-chatgpt-desktop}"
          mkdir -p -- "$CHATGPT_DESKTOP_CODEX_HOME"
          export CODEX_HOME="$CHATGPT_DESKTOP_CODEX_HOME"

          '''
          path.write_text(source.replace(anchor, isolation + anchor), encoding="utf-8")
          PY

          bash -n packaging/appimage/AppRun
          test "$(grep -Fxc 'CHATGPT_DESKTOP_CODEX_HOME="${CHATGPT_DESKTOP_CODEX_HOME:-$HOME/.codex-chatgpt-desktop}"' packaging/appimage/AppRun)" -eq 1
          test "$(grep -Fxc 'mkdir -p -- "$CHATGPT_DESKTOP_CODEX_HOME"' packaging/appimage/AppRun)" -eq 1
          test "$(grep -Fxc 'export CODEX_HOME="$CHATGPT_DESKTOP_CODEX_HOME"' packaging/appimage/AppRun)" -eq 1

      - name: Build Stock AppImage from unmodified official resources
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(date -u +%Y.%m.%d.%H%M%S)"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          mkdir -p "$STOCK_DIST_DIR" "$RELEASE_ASSETS_DIR"

          cat > "$STOCK_FEATURES_CONFIG" <<'JSON'
          {
            "enabled": []
          }
          JSON

          cd codex-desktop-linux
          bash scripts/install-deps.sh

          CODEX_LINUX_FEATURES_CONFIG="$STOCK_FEATURES_CONFIG" \
          CODEX_PATCH_REPORT_JSON="$STOCK_PATCH_REPORT_JSON" \
            make build-app

          node - "$STOCK_PATCH_REPORT_JSON" <<'NODE'
          const fs = require("node:fs");
          const reportPath = process.argv[2];
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          if (!Array.isArray(report.enabledFeatures) || report.enabledFeatures.length !== 0) {
            throw new Error("Stock build unexpectedly enabled a Linux feature");
          }
          const changed = (report.patches ?? []).filter((patch) =>
            patch.status === "applied" || patch.status === "applied-with-warnings",
          );
          if (changed.length !== 0) {
            throw new Error(`Stock build unexpectedly applied patches: ${changed.map((item) => item.name).join(", ")}`);
          }
          console.log("Stock patch report: no enabled features or applied patches");
          NODE

          CODEX_LINUX_FEATURES_CONFIG="$STOCK_FEATURES_CONFIG" \
          DIST_DIR_OVERRIDE="$STOCK_DIST_DIR" \
          APPIMAGE_APPDIR_OVERRIDE="$RUNNER_TEMP/codex-stock.AppDir" \
          PACKAGE_VERSION="$PACKAGE_VERSION" \
            make appimage

          bash -n "$RUNNER_TEMP/codex-stock.AppDir/AppRun"
          test "$(grep -Fxc 'export CODEX_HOME="$CHATGPT_DESKTOP_CODEX_HOME"' "$RUNNER_TEMP/codex-stock.AppDir/AppRun")" -eq 1

          mapfile -t stock_images < <(find "$STOCK_DIST_DIR" -maxdepth 1 -type f -name '*.AppImage' -print)
          test "${#stock_images[@]}" -eq 1
          install -m 0755 "${stock_images[0]}" "$RELEASE_ASSETS_DIR/codex-desktop-stock-x86_64.AppImage"

      - name: Detect whether the isolated i3bar fix still applies
        id: tray_contract
        run: |
          set -euo pipefail

          node --check variants/i3bar-fixed/detect-upstream-contract.js
          node variants/i3bar-fixed/detect-upstream-contract.test.js

          rm -rf "$RUNNER_TEMP/codex-stock-asar"
          npx --yes @electron/asar extract \
            codex-desktop-linux/codex-app/resources/app.asar \
            "$RUNNER_TEMP/codex-stock-asar"

          node variants/i3bar-fixed/detect-upstream-contract.js \
            "$RUNNER_TEMP/codex-stock-asar" \
            codex-desktop-linux/codex-app/ChatGPT \
            codex-desktop-linux/codex-app/version \
            "$GITHUB_OUTPUT"

      - name: Build isolated i3bar Fixed AppImage, DEB and RPM
        if: steps.tray_contract.outputs.mode == 'apply'
        run: |
          set -euo pipefail

          FIXED_ROOT="$GITHUB_WORKSPACE/variants/i3bar-fixed"
          FIXED_FEATURE="$FIXED_ROOT/overlay-features/linux-tray-single-arg"
          mkdir -p "$I3BAR_FIXED_DIST_DIR"

          node --check "$FIXED_FEATURE/patch.js"
          node "$FIXED_FEATURE/test.js"

          rm -rf codex-desktop-linux/linux-features/linux-tray-single-arg
          cp -a "$FIXED_FEATURE" codex-desktop-linux/linux-features/linux-tray-single-arg

          cat > "$I3BAR_FIXED_FEATURES_CONFIG" <<'JSON'
          {
            "enabled": ["linux-tray-single-arg"]
          }
          JSON

          cd codex-desktop-linux
          CODEX_LINUX_FEATURES_CONFIG="$I3BAR_FIXED_FEATURES_CONFIG" \
          CODEX_PATCH_REPORT_JSON="$I3BAR_FIXED_PATCH_REPORT_JSON" \
            make build-app

          node scripts/ci/validate-patch-report.js "$I3BAR_FIXED_PATCH_REPORT_JSON" \
            --require-enabled-feature linux-tray-single-arg \
            --require-applied feature:linux-tray-single-arg:linux-tray-registration \
            --require-applied feature:linux-tray-single-arg:linux-tray-readiness

          rm -rf "$RUNNER_TEMP/codex-i3bar-fixed-asar"
          npx --yes @electron/asar extract \
            codex-app/resources/app.asar \
            "$RUNNER_TEMP/codex-i3bar-fixed-asar"

          node "$FIXED_FEATURE/test.js" "$RUNNER_TEMP/codex-i3bar-fixed-asar"

          "$FIXED_ROOT/scripts/install-stock-electron-runtime.sh" codex-app
          test -f codex-app/.codex-linux/stock-electron-runtime.json

          CODEX_LINUX_FEATURES_CONFIG="$I3BAR_FIXED_FEATURES_CONFIG" \
          DIST_DIR_OVERRIDE="$I3BAR_FIXED_DIST_DIR" \
          APPIMAGE_APPDIR_OVERRIDE="$RUNNER_TEMP/codex-i3bar-fixed.AppDir" \
          PACKAGE_VERSION="$PACKAGE_VERSION" \
            make appimage

          bash -n "$RUNNER_TEMP/codex-i3bar-fixed.AppDir/AppRun"
          test "$(grep -Fxc 'export CODEX_HOME="$CHATGPT_DESKTOP_CODEX_HOME"' "$RUNNER_TEMP/codex-i3bar-fixed.AppDir/AppRun")" -eq 1

          CODEX_LINUX_FEATURES_CONFIG="$I3BAR_FIXED_FEATURES_CONFIG" \
          DIST_DIR_OVERRIDE="$I3BAR_FIXED_DIST_DIR" \
          PKG_ROOT_OVERRIDE="$RUNNER_TEMP/codex-i3bar-fixed-deb-root" \
          PACKAGE_VERSION="$PACKAGE_VERSION" \
            make deb

          CODEX_LINUX_FEATURES_CONFIG="$I3BAR_FIXED_FEATURES_CONFIG" \
          DIST_DIR_OVERRIDE="$I3BAR_FIXED_DIST_DIR" \
          PACKAGE_VERSION="$PACKAGE_VERSION" \
            make rpm

          mapfile -t fixed_images < <(find "$I3BAR_FIXED_DIST_DIR" -maxdepth 1 -type f -name '*.AppImage' -print)
          test "${#fixed_images[@]}" -eq 1
          install -m 0755 "${fixed_images[0]}" "$RELEASE_ASSETS_DIR/codex-desktop-i3bar-fixed-x86_64.AppImage"

      - name: Build Arch Linux package from the i3bar Fixed variant
        if: steps.tray_contract.outputs.mode == 'apply'
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/arch-dist"

          cat > "$RUNNER_TEMP/build-arch-package.sh" <<'ARCH_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            alsa-lib at-spi2-core atk base-devel ca-certificates cairo curl dbus \
            dpkg expat gdk-pixbuf2 git glib2 gnupg graphite gtk3 libcups libdrm \
            libglvnd libnotify libusb libx11 libxcb libxcomposite libxdamage \
            libxext libxfixes libxkbcommon libxrandr mesa nodejs npm nspr nss \
            openssl pango python rustup shadow systemd-libs tar unzip util-linux \
            xz zstd

          useradd --create-home builder
          mkdir -p /work
          chown builder:builder /work
          chmod 0777 /out

          cat > /tmp/build-as-builder.sh <<'BUILDER_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          cd /work
          git clone https://github.com/ilysenko/codex-desktop-linux.git
          cd codex-desktop-linux
          git checkout --detach "$UPSTREAM_SHA"
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"
          rustup default stable

          rm -rf linux-features/linux-tray-single-arg
          cp -a /i3bar-fixed-feature linux-features/linux-tray-single-arg
          node --check linux-features/linux-tray-single-arg/patch.js
          node linux-features/linux-tray-single-arg/test.js

          CODEX_LINUX_FEATURES_CONFIG="$PWD/linux-features/features.i3bar-fixed.json"
          CODEX_PATCH_REPORT_JSON="$PWD/reports/i3bar-fixed/patch-report.json"
          export CODEX_LINUX_FEATURES_CONFIG CODEX_PATCH_REPORT_JSON

          cat > "$CODEX_LINUX_FEATURES_CONFIG" <<'JSON'
          {
            "enabled": ["linux-tray-single-arg"]
          }
          JSON

          make build-app

          node scripts/ci/validate-patch-report.js "$CODEX_PATCH_REPORT_JSON" \
            --require-enabled-feature linux-tray-single-arg \
            --require-applied feature:linux-tray-single-arg:linux-tray-registration \
            --require-applied feature:linux-tray-single-arg:linux-tray-readiness

          CODEX_STOCK_ELECTRON_CACHE_DIR=/tmp/stock-electron-cache \
            /install-stock-electron-runtime.sh codex-app
          test -f codex-app/.codex-linux/stock-electron-runtime.json

          make pacman PACKAGE_VERSION="$PACKAGE_VERSION"
          find dist -maxdepth 1 -type f -name '*.pkg.tar.zst' ! -name 'codex-desktop-latest.pkg.tar.zst' -exec cp -v {} /out/ \;
          BUILDER_SCRIPT

          chmod +x /tmp/build-as-builder.sh
          chown builder:builder /tmp/build-as-builder.sh

          runuser -u builder -- env \
            HOME=/home/builder \
            UPSTREAM_SHA="$UPSTREAM_SHA" \
            PACKAGE_VERSION="$PACKAGE_VERSION" \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            /tmp/build-as-builder.sh
          ARCH_SCRIPT

          chmod +x "$RUNNER_TEMP/build-arch-package.sh"

          docker run --rm \
            -e UPSTREAM_SHA \
            -e PACKAGE_VERSION \
            -v "$RUNNER_TEMP/build-arch-package.sh:/build-arch-package.sh:ro" \
            -v "$GITHUB_WORKSPACE/variants/i3bar-fixed/overlay-features/linux-tray-single-arg:/i3bar-fixed-feature:ro" \
            -v "$GITHUB_WORKSPACE/variants/i3bar-fixed/scripts/install-stock-electron-runtime.sh:/install-stock-electron-runtime.sh:ro" \
            -v "$GITHUB_WORKSPACE/arch-dist:/out" \
            archlinux:latest \
            /build-arch-package.sh

      - name: Validate release files
        env:
          I3BAR_FIXED_MODE: ${{ steps.tray_contract.outputs.mode }}
        run: |
          set -euo pipefail

          test -f "$RELEASE_ASSETS_DIR/codex-desktop-stock-x86_64.AppImage"

          if [ "$I3BAR_FIXED_MODE" = "apply" ]; then
            test -f "$RELEASE_ASSETS_DIR/codex-desktop-i3bar-fixed-x86_64.AppImage"

            find "$I3BAR_FIXED_DIST_DIR" -maxdepth 1 -type f \
              \( -name '*.deb' -o -name '*.rpm' \) \
              -exec cp -v {} "$RELEASE_ASSETS_DIR/" \;

            find arch-dist -maxdepth 1 -type f -name '*.pkg.tar.zst' \
              -exec cp -v {} "$RELEASE_ASSETS_DIR/" \;

            compgen -G "$RELEASE_ASSETS_DIR/*.deb" >/dev/null
            compgen -G "$RELEASE_ASSETS_DIR/*.rpm" >/dev/null
            compgen -G "$RELEASE_ASSETS_DIR/*.pkg.tar.zst" >/dev/null
          else
            test ! -e "$RELEASE_ASSETS_DIR/codex-desktop-i3bar-fixed-x86_64.AppImage"
          fi

          sha256sum "$RELEASE_ASSETS_DIR"/* > "$RELEASE_ASSETS_DIR/SHA256SUMS.txt"
          ls -lh "$RELEASE_ASSETS_DIR"

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          I3BAR_FIXED_MODE: ${{ steps.tray_contract.outputs.mode }}
          I3BAR_FIXED_REASON: ${{ steps.tray_contract.outputs.reason }}
        run: |
          set -euo pipefail

          if [ "$I3BAR_FIXED_MODE" = "apply" ]; then
            FIXED_NOTE="Included: verified isolated workaround applied to the known upstream contract."
          else
            FIXED_NOTE="Not included: isolated workaround skipped ($I3BAR_FIXED_REASON). Use and test the Stock AppImage."
          fi

          cat > release-notes.md <<EOF_NOTES
          Automated build from the public upstream repository:
          https://github.com/ilysenko/codex-desktop-linux

          Upstream branch: main
          Upstream commit: \`$UPSTREAM_SHA\`

          AppImage variants:
          - \`codex-desktop-stock-x86_64.AppImage\`: byte-for-byte official \`resources/app.asar\` plus the package's Electron runtime and bundled tools, with no i3bar source overlay or runtime replacement; the outer AppImage is community-packaged.
          - \`codex-desktop-i3bar-fixed-x86_64.AppImage\`: isolated i3bar workaround; patches both tray bundle locations, replaces Owl with matching stock Electron, rebuilds better-sqlite3 and node-pty, and verifies GtkStatusIcon/XEmbed. $FIXED_NOTE

          AppImage configuration:
          - Both AppImage variants use an isolated \`CODEX_HOME=\$HOME/.codex-chatgpt-desktop\` so ChatGPT Desktop does not share the host Codex CLI's \`~/.codex\` configuration and local state.
          - Set \`CHATGPT_DESKTOP_CODEX_HOME=/path/to/directory\` only when a different Desktop-only location is intentionally required.

          DEB, RPM and Arch packages use the i3bar Fixed variant when that verified workaround is applicable. Their upstream native \`CODEX_HOME\` and external-URL behavior are unchanged.
          SHA256 checksums cover every published asset.

          <!-- upstream-sha: $UPSTREAM_SHA -->
          EOF_NOTES

          TAG_NAME="latest"
          gh release delete "$TAG_NAME" -y --cleanup-tag || true
          gh release create "$TAG_NAME" "$RELEASE_ASSETS_DIR"/* --title "Latest" --notes-file release-notes.md
