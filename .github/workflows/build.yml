name: Build Codex Desktop Linux

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this upstream commit is already published
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - overlay-features/native-linux-tray/**
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: codex-linux-latest
  cancel-in-progress: false

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Compare upstream with latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force == true) }}
        run: |
          set -euo pipefail

          UPSTREAM_SHA="$(git ls-remote https://github.com/ilysenko/codex-desktop-linux.git refs/heads/main | awk '{print $1}')"
          test -n "$UPSTREAM_SHA"

          PUBLISHED_BODY="$(gh release view latest --json body --jq '.body' 2>/dev/null || true)"

          if [ "$FORCE" = "true" ] || ! grep -Fq "<!-- upstream-sha: $UPSTREAM_SHA -->" <<<"$PUBLISHED_BODY"; then
            SHOULD_BUILD=true
          else
            SHOULD_BUILD=false
          fi

          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish packages
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UPSTREAM_SHA: ${{ needs.check.outputs.upstream_sha }}
      APPIMAGE_EXTRACT_AND_RUN: 1
      CODEX_ENFORCE_CRITICAL_PATCHES: 0
      CODEX_LINUX_FEATURES_CONFIG: ${{ github.workspace }}/codex-desktop-linux/linux-features/features.codex-linux.json
      CODEX_PATCH_REPORT_JSON: ${{ github.workspace }}/codex-desktop-linux/patch-report.json
    steps:
      - name: Checkout packaging overlay
        uses: actions/checkout@v4

      - name: Install appimagetool
        run: |
          sudo wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Clone exact upstream revision
        run: |
          set -euo pipefail

          git clone https://github.com/ilysenko/codex-desktop-linux.git
          cd codex-desktop-linux
          git checkout --detach "$UPSTREAM_SHA"
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Restore native Linux tray retention
        run: |
          set -euo pipefail

          node --check overlay-features/native-linux-tray/patch.js
          rm -rf codex-desktop-linux/linux-features/native-linux-tray
          cp -a overlay-features/native-linux-tray codex-desktop-linux/linux-features/native-linux-tray

          cat > "$CODEX_LINUX_FEATURES_CONFIG" <<'JSON'
          {
            "enabled": ["ui-tweaks", "native-linux-tray"],
            "settings": {
              "ui-tweaks": {
                "tweaks": {
                  "appearance": {
                    "dockIcon": {
                      "enabled": true
                    }
                  }
                }
              }
            }
          }
          JSON

      - name: Build AppImage, DEB and RPM
        run: |
          set -euo pipefail

          cd codex-desktop-linux
          bash scripts/install-deps.sh
          make build-app

          node scripts/ci/validate-patch-report.js "$CODEX_PATCH_REPORT_JSON" \
            --require-enabled-feature ui-tweaks \
            --require-enabled-feature native-linux-tray \
            --require-applied feature:ui-tweaks:appearance-dock-icon-main-process \
            --require-applied feature:ui-tweaks:appearance-dock-icon-settings-row \
            --require-applied feature:native-linux-tray:retain-linux-tray

          test -f codex-app/resources/dock-icon/icon-chatgpt.png
          test -x codex-app/resources/dock-icon/sync-desktop-icon.sh

          rm -rf "$RUNNER_TEMP/codex-asar-check"
          npx --yes @electron/asar extract codex-app/resources/app.asar "$RUNNER_TEMP/codex-asar-check"
          MAIN_BUNDLE="$(find "$RUNNER_TEMP/codex-asar-check/.vite/build" -maxdepth 1 -type f -name 'main*.js' -print -quit)"
          test -n "$MAIN_BUNDLE"
          grep -Fq 'codexLinuxApplyDockIcon' "$MAIN_BUNDLE"
          grep -Fq 'codexLinuxNativeTrayRetention' "$MAIN_BUNDLE"
          grep -Fq 'BrowserWindow.getAllWindows()' "$MAIN_BUNDLE"
          node --check "$MAIN_BUNDLE"

          make appimage
          make deb
          make rpm

      - name: Build Arch Linux package
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/arch-dist"

          cat > "$RUNNER_TEMP/build-arch-package.sh" <<'ARCH_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            base-devel ca-certificates curl dpkg git gnupg nodejs npm python \
            rustup shadow tar unzip util-linux xz zstd

          useradd --create-home builder
          mkdir -p /work
          chown builder:builder /work
          chmod 0777 /out

          cat > /tmp/build-as-builder.sh <<'BUILDER_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          cd /work
          git clone https://github.com/ilysenko/codex-desktop-linux.git
          cd codex-desktop-linux
          git checkout --detach "$UPSTREAM_SHA"
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"
          rustup default stable

          rm -rf linux-features/native-linux-tray
          cp -a /overlay-native-linux-tray linux-features/native-linux-tray
          node --check linux-features/native-linux-tray/patch.js

          CODEX_LINUX_FEATURES_CONFIG="$PWD/linux-features/features.codex-linux.json"
          CODEX_PATCH_REPORT_JSON="$PWD/patch-report.json"
          export CODEX_LINUX_FEATURES_CONFIG CODEX_PATCH_REPORT_JSON

          cat > "$CODEX_LINUX_FEATURES_CONFIG" <<'JSON'
          {
            "enabled": ["ui-tweaks", "native-linux-tray"],
            "settings": {
              "ui-tweaks": {
                "tweaks": {
                  "appearance": {
                    "dockIcon": {
                      "enabled": true
                    }
                  }
                }
              }
            }
          }
          JSON

          make build-app

          node scripts/ci/validate-patch-report.js "$CODEX_PATCH_REPORT_JSON" \
            --require-enabled-feature ui-tweaks \
            --require-enabled-feature native-linux-tray \
            --require-applied feature:ui-tweaks:appearance-dock-icon-main-process \
            --require-applied feature:ui-tweaks:appearance-dock-icon-settings-row \
            --require-applied feature:native-linux-tray:retain-linux-tray

          test -f codex-app/resources/dock-icon/icon-chatgpt.png
          test -x codex-app/resources/dock-icon/sync-desktop-icon.sh

          make pacman
          find dist -maxdepth 1 -type f -name '*.pkg.tar.zst' ! -name 'codex-desktop-latest.pkg.tar.zst' -exec cp -v {} /out/ \;
          BUILDER_SCRIPT

          chmod +x /tmp/build-as-builder.sh
          chown builder:builder /tmp/build-as-builder.sh

          runuser -u builder -- env \
            HOME=/home/builder \
            UPSTREAM_SHA="$UPSTREAM_SHA" \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            CODEX_ENFORCE_CRITICAL_PATCHES=0 \
            /tmp/build-as-builder.sh
          ARCH_SCRIPT

          chmod +x "$RUNNER_TEMP/build-arch-package.sh"

          docker run --rm \
            -e UPSTREAM_SHA \
            -v "$RUNNER_TEMP/build-arch-package.sh:/build-arch-package.sh:ro" \
            -v "$GITHUB_WORKSPACE/overlay-features/native-linux-tray:/overlay-native-linux-tray:ro" \
            -v "$GITHUB_WORKSPACE/arch-dist:/out" \
            archlinux:latest \
            /build-arch-package.sh

      - name: Validate release files
        run: |
          set -euo pipefail

          mkdir -p release-assets

          find codex-desktop-linux/dist -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp -v {} release-assets/ \;

          find arch-dist -maxdepth 1 -type f -name '*.pkg.tar.zst' \
            -exec cp -v {} release-assets/ \;

          compgen -G 'release-assets/*.AppImage' >/dev/null
          compgen -G 'release-assets/*.deb' >/dev/null
          compgen -G 'release-assets/*.rpm' >/dev/null
          compgen -G 'release-assets/*.pkg.tar.zst' >/dev/null

          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
          ls -lh release-assets

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF_NOTES
          Automated build from the public upstream repository:
          https://github.com/ilysenko/codex-desktop-linux

          Upstream branch: main
          Upstream commit: \`$UPSTREAM_SHA\`

          Packages: AppImage, DEB, RPM, Arch Linux package, and SHA256 checksums.
          Linux system tray: keeps the native Electron Tray alive on Linux and uses the upstream Dock icon implementation for its image. Both patches must pass validation before publishing.

          <!-- upstream-sha: $UPSTREAM_SHA -->
          EOF_NOTES

          TAG_NAME="latest"
          gh release delete "$TAG_NAME" -y --cleanup-tag || true
          gh release create "$TAG_NAME" release-assets/* --title "Latest" --notes-file release-notes.md
